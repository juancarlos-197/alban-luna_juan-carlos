 <div class="login-container">
      <div class="login-box">
        <h1>Iniciar Sesión</h1>
        <!--email: jalban.dacompsc@gmail.com -->

        <form *ngIf="!showRegister()" (ngSubmit)="onLogin()">
          <div class="form-group">
            <label for="email">Email:</label>
            <input 
              type="email" 
              id="email" 
              [(ngModel)]="email" 
              name="email"
              required
              placeholder="jalban.dacompsc@gmail.com"
            />
          </div>

<!-- Contraseña: 123456789 -->
          <div class="form-group">
            <label for="password">Contraseña:</label>
            <input 
              type="password" 
              id="password" 
              [(ngModel)]="password" 
              name="password"
              required
              placeholder="123456789"
            />
          </div>

          <div *ngIf="error()" class="error-message">
            {{ error() }}
          </div>

          <button 
            type="submit" 
            [disabled]="isLoading()"
            class="btn-login"
          >
            {{ isLoading() ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
          </button>
        </form>

        <div class="signup-link">
          <p>¿No tienes cuenta? <a href="javascript:void(0)" (click)="toggleRegister()">
            {{ showRegister() ? 'Volver a login' : 'Registrarse' }}
          </a></p>
        </div>

        <form *ngIf="showRegister()" (ngSubmit)="onRegister()">
          <h2>Crear Cuenta</h2>
          <div class="form-group">
            <label for="reg-email">Email:</label>
            <input 
              type="email" 
              id="reg-email" 
              [(ngModel)]="registerEmail" 
              name="registerEmail"
              required
              placeholder="tu@email.com"
            />
          </div>

          <div class="form-group">
            <label for="reg-password">Contraseña:</label>
            <input 
              type="password" 
              id="reg-password" 
              [(ngModel)]="registerPassword" 
              name="registerPassword"
              required
              placeholder="••••••••"
            />
          </div>

          <div *ngIf="error()" class="error-message">
            {{ error() }}
          </div>

          <button 
            type="submit" 
            [disabled]="isLoading()"
            class="btn-register"
          >
            {{ isLoading() ? 'Registrando...' : 'Registrarse' }}
          </button>
        </form>
      </div>
    </div>
